[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cua-python"
version = "0.1.0"
description = "Native Python computer-use sample runner"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "openai>=2,<3", "playwright==1.58.0", "PyAutoGUI==0.9.54",
  "Pillow==11.3.0", "python-dotenv>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.11", "mypy>=1.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: opt-in real Responses API and desktop input", "browser: opt-in Chromium verification without desktop input"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
