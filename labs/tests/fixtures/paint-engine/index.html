<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sketch Studio browser checks</title>
    <style>
      body {
        font: 16px system-ui;
        max-width: 850px;
        margin: 40px auto;
        padding: 0 24px;
        color: #252936;
      }
      li {
        padding: 8px;
      }
      li[data-result="pass"] {
        color: #216b42;
      }
      li[data-result="fail"] {
        color: #a71924;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Sketch Studio browser checks</h1>
    <p>
      Tests the production canvas, tool, history, and persistence modules using
      the browser's real Canvas 2D and IndexedDB implementations. Uses only this
      test origin's draft storage. Reload to run again.
    </p>
    <p id="summary" role="status">Running…</p>
    <ol id="results"></ol>
    <script type="module" src="./tests.js"></script>
  </body>
</html>
