name: JavaScript sample app

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: javascript-app
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: javascript-app/.node-version
          package-manager-cache: false
      - name: Enable the pinned pnpm version
        run: corepack enable
      - name: Install locked app and lab-test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../labs install --frozen-lockfile
      - name: Install Chromium and system libraries
        run: pnpm playwright:install:with-deps
      - name: Lint, typecheck, test, and build
        run: pnpm check
      - name: Check app integration with the shared labs
        run: pnpm --dir ../labs test:javascript
      - name: Smoke test production runner and console
        env:
          OPENAI_API_KEY: ''
          CUA_RESPONSES_MODE: fallback
          HOST: 127.0.0.1
          PORT: '4001'
          RUNNER_BASE_URL: http://127.0.0.1:4001
        run: |
          node apps/runner/dist/index.js > /tmp/runner.log 2>&1 &
          runner_pid=$!
          (cd apps/demo-web && exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000) > /tmp/web.log 2>&1 &
          web_pid=$!
          cleanup() {
            result=$?
            trap - EXIT
            kill "$runner_pid" "$web_pid" 2>/dev/null || true
            wait "$runner_pid" "$web_pid" 2>/dev/null || true
            if [ "$result" -ne 0 ]; then cat /tmp/runner.log /tmp/web.log; fi
            exit "$result"
          }
          trap cleanup EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4001/health
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = process.env.RUNNER_BASE_URL;
          const scenarios = await fetch(`${base}/api/scenarios`).then(r => r.json());
          assert.equal(scenarios.length, 3);
          assert(scenarios.every(scenario => scenario.defaultPrompt && scenario.workspaceTemplatePath));
          assert.equal(await fetch(`${base}/api/runs/active`).then(r => r.json()), null);
          JS
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ > /tmp/web.html
