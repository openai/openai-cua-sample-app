<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CUA container check</title>
<style>
  body { margin: 40px; font: 22px sans-serif; background: #eef3f8; color: #17243a; }
  input, button { font: inherit; padding: 12px; }
  button { display: block; margin-top: 1300px; }
  #result { padding: 20px 0; min-height: 60px; }
</style>
<h1>CUA container check</h1>
<p>Enter Alice, scroll down, and submit. This is a local test.</p>
<form>
  <label>Name <input id="name" autocomplete="off"></label>
  <button>Submit</button>
</form>
<div id="result" role="status"></div>
<script>
  const events = { clicks: 0, wheels: 0, keys: 0 };
  for (const [event, key] of [["click", "clicks"], ["wheel", "wheels"], ["keydown", "keys"]]) {
    document.addEventListener(event, e => { if (e.isTrusted) events[key]++; });
  }
  document.querySelector("form").addEventListener("submit", async event => {
    event.preventDefault();
    const response = await fetch("/fixture/result", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: document.querySelector("input").value, ...events }),
    });
    const { success } = await response.json();
    document.querySelector("#result").textContent = success ? "Success: Alice submitted." : "Check the name, click, and scroll interactions.";
  });
</script>
</html>
