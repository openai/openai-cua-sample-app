name: gpt6-cua

x-runtime: &runtime
  platform: linux/amd64
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=./chromium-seccomp.json
  shm_size: 512mb
  mem_limit: 2g
  cpus: 2
  pids_limit: 256
  tmpfs:
    - /tmp:rw,nosuid,size=512m
  environment:
    OPENAI_EXAMPLE_CODE_EXECUTION_TOKEN: ${OPENAI_EXAMPLE_CODE_EXECUTION_TOKEN:?Set a random execution-service token first}

services:
  gpt6-js-image:
    <<: *runtime
    image: gpt6-js-image:local
    build:
      context: .
      dockerfile: gpt6-js-image/Dockerfile
    ports: ["127.0.0.1:8001:8000"]
  gpt6-py-image:
    <<: *runtime
    image: gpt6-py-image:local
    build:
      context: .
      dockerfile: gpt6-py-image/Dockerfile
    ports: ["127.0.0.1:8002:8000"]

networks:
  default:
    driver: bridge
